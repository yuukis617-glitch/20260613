<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>補助金ポータル（サンプル）</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="top">
<main>
  <div class="wrap">
    <section class="hero">
      <div>
        <h1>🔍 補助金ポータル</h1>
        <p class="tagline">貴社にピッタリの補助金が見つかる！</p>
        <div class="badges">
          <div class="badge-circle"><b>最新の</b><small>公募情報を<br>一覧で確認</small></div>
          <div class="badge-circle"><b>全国の</b><small>補助金データ</small></div>
          <div class="badge-circle"><b>簡単</b><small>探しやすい</small></div>
        </div>
        <svg viewBox="0 0 300 200" role="img" aria-label="補助金を探すイメージ">
          <ellipse cx="110" cy="180" rx="60" ry="10" fill="#d9e6f5"/>
          <circle cx="150" cy="80" r="42" fill="#bfe6fb" stroke="#1e88d0" stroke-width="10"/>
          <line x1="125" y1="115" x2="95" y2="160" stroke="#1e88d0" stroke-width="12" stroke-linecap="round"/>
          <rect x="190" y="60" width="90" height="70" rx="6" fill="#e3eefb" stroke="#c4d4ea"/>
          <rect x="202" y="95" width="10" height="25" fill="#3b6fd0"/><rect x="220" y="82" width="10" height="38" fill="#3b6fd0"/><rect x="238" y="100" width="10" height="20" fill="#3b6fd0"/>
        </svg>
      </div>

      <form class="search-card" id="search-form">
        <div class="row">
          <div class="label">地域</div>
          <div class="fields"><select id="pref" aria-label="都道府県"></select><select id="city" aria-label="区市町村"></select></div>
        </div>
        <div class="row">
          <div class="label">業種</div>
          <div class="fields"><select id="industry" aria-label="業種"></select></div>
        </div>
        <div class="row">
          <div class="label">カテゴリ</div>
          <div class="fields"><select id="category" aria-label="カテゴリ"></select></div>
        </div>
        <input type="text" id="keyword" placeholder="キーワード検索。例：ものづくり補助金、最低賃金など。">
        <button class="btn-search" type="submit">🔍 検索</button>
      </form>
    </section>

    <h2 class="section-title">🔔 新着補助金</h2>
    <div class="new-list" id="new-list" aria-live="polite"></div>
  </div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
